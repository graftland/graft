name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rebuild:
        description:
          Commits to build again even if they have docs, separated by spaces
        type: string
        default: ""

permissions:
  contents: read

env:
  # The production site, a Cloudflare Worker that serves the newest stable
  # release. The newest 15 release tags and the newest 30 commits on main also
  # keep their own Worker Preview at
  # https://<first 12 characters of the hash>.<site host>/, and
  # https://versions.<site host>/ serves the commit list and the select.
  DOCS_URL: https://docs.graft.land/
  DOCS_WORKER: graft-docs
  # Old addresses, which now only redirect to DOCS_URL.
  DOCS_OLD_URL: https://graftland.github.io/graft/
  DOCS_PAGES_URL: https://graft-docs-ekb.pages.dev/
  DOCS_PAGES_PROJECT: graft-docs

jobs:
  plan:
    name: Choose the commits to build
    # Production follows main: a run started by hand on another branch does
    # nothing.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.plan.outputs.commits }}
      production: ${{ steps.plan.outputs.production }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: plan
        run: node packages/docs/publish.mjs plan
        env:
          DOCS_MODE:
            ${{ startsWith(github.ref, 'refs/tags/') && 'tag' || 'main' }}
          DOCS_REBUILD: ${{ inputs.rebuild }}

  production:
    name: Build ${{ needs.plan.outputs.production }} for production
    needs: plan
    if: needs.plan.outputs.production != ''
    runs-on: ubuntu-latest
    # Holds the Cloudflare secrets.
    environment: docs
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The publishing tools come from this run's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/docs-commit
        with:
          commit: ${{ needs.plan.outputs.production }}
          production: "true"

  build:
    name: Build ${{ matrix.commit }}
    needs: [plan, production]
    # Production goes first because its deploy creates the Worker and its
    # domain on the first run; a failed one does not hold back the others.
    if:
      always() && needs.plan.result == 'success' && needs.plan.outputs.commits
      != '[]'
    runs-on: ubuntu-latest
    environment: docs
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    strategy:
      # One commit that no longer builds does not stop the others.
      fail-fast: false
      max-parallel: 8
      matrix:
        commit: ${{ fromJSON(needs.plan.outputs.commits) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/docs-commit
        with:
          commit: ${{ matrix.commit }}

  list:
    name: Update the commit list
    needs: [plan, production, build]
    # Runs after failed builds too, and when nothing needed a build.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: ${{ env.DOCS_URL }}
    # Every run reads and writes the live list, so they go one at a time, in
    # order, and none is dropped.
    concurrency:
      group: docs-list
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: deployed-*
          path: deployed
          merge-multiple: true
      - name: Publish the list and delete the docs no longer kept
        run: node packages/docs/publish.mjs list deployed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Production moves only once its build is deployed.
          DOCS_PRODUCTION:
            ${{ needs.production.result == 'success' &&
            needs.plan.outputs.production || '' }}
      - name: Redirect the old Cloudflare Pages address
        if: github.ref == 'refs/heads/main'
        run: node packages/docs/publish.mjs retire-pages pages-redirect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  redirect:
    name: Redirect the old GitHub Pages address
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: docs-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the redirect pages
        run: node packages/docs/publish.mjs redirect redirect-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirect-site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
