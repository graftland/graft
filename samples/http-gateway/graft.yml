# yaml-language-server: $schema=../../packages/cli/schema.json
# plugin modules apply while the server keeps running.
- id: router
  name: "@graftland/plugin-http/router"

- id: server
  name: "@graftland/plugin-http"
  config:
    port: 3000

- id: health
  name: ./dist/plugins/health.js

- id: inspector
  name: ./dist/plugins/inspector.js

- id: todo-store
  name: ./dist/plugins/todo-store.js
  config:
    seed:
      - Try the gateway
      - Disable this store in graft.yml

- id: todos
  name: ./dist/plugins/todos.js

- id: events
  name: ./dist/plugins/events.js

- id: http-api
  name: "@graftland/plugin-http-api"
  config:
    title: Todos
    version: 1.0.0

- id: docs
  name: "@graftland/plugin-http-api/scalar"
